apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/*
 * Signed firmware releases, staged from the repo folder into the asset tree.
 *
 * See the sourceSets note in `android {}` for why this is a copy rather than a
 * source-set root. The task is wired to preBuild so it runs before assets are
 * merged, and it is incremental - a build with no new release does nothing.
 */
def signedFirmwareAssets = file("$buildDir/signedFirmwareAssets")

tasks.register('stageSignedFirmware', Copy) {
    from "$rootDir/../signed_firmware"
    into new File(signedFirmwareAssets, 'signed_firmware')
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.okrn"

    /*
     * WHERE THE C++ OBJECT TREE LIVES, AND WHY IT IS NOT UNDER THE PROJECT.
     *
     * Windows still enforces MAX_PATH at 260 characters unless LongPathsEnabled
     * is set, and it is not set on this bench. The generated object files embed
     * the whole mangled source path, e.g.
     *
     *   <staging>/safeareacontext_autolinked_build/CMakeFiles/
     *     react_codegen_safeareacontext.dir/C_/Users/.../node_modules/
     *     react-native-safe-area-context/common/cpp/react/renderer/components/
     *     safeareacontext/RNCSafeAreaViewShadowNode.cpp.o
     *
     * which is about 130 characters before the staging directory is counted.
     * Debug survives it; RELEASE DOES NOT, because ".cxx/RelWithDebInfo" is
     * eleven characters longer than ".cxx/Debug" - so the app built and
     * installed happily for weeks and only fell over the first time anyone
     * asked for an APK to hand to somebody else. ninja says
     * "Filename longer than 260 characters" and nothing else.
     *
     * Staging on a short path buys back the ~65 characters the default
     * "<project>/android/app/.cxx" costs. Windows only, and skipped when the
     * drive is absent, so Linux and the Pi build exactly as before. Override
     * with OKRN_CXX_DIR if D: is not where your spare room is.
     */
    externalNativeBuild {
        cmake {
            def onWindows = System.getProperty('os.name').toLowerCase().contains('windows')
            def staging = System.getenv('OKRN_CXX_DIR') ?: 'D:/okcxx'
            if (onWindows && file(staging).parentFile?.exists()) {
                buildStagingDirectory = file(staging)
            }
        }
    }

    /*
     * The signed firmware releases are bundled straight out of the repo folder.
     *
     * ONE SOURCE, not a copy anybody maintains: `ok-rn/signed_firmware/` is
     * both what a person commits and what ends up in the APK, so a release
     * dropped in is in the next build. The app reads them through
     * NativeShare.listAssets/readAsset, because Metro cannot require a text
     * file and a megabyte of hex per version has no business in the JS bundle
     * every screen loads.
     *
     * It goes through a staging directory rather than being added to
     * assets.srcDirs directly, because a source set root becomes the TOP of
     * the asset tree: pointing at the folder would scatter the releases beside
     * React Native's own assets with no directory to list. Staging puts them
     * back under `signed_firmware/`, which is the name the app asks for.
     *
     * This is what makes an update work in airplane mode. The URL field and the
     * document picker both still exist; neither of them works on a phone that
     * has never been online and has no file manager on it.
     */
    sourceSets {
        main {
            assets.srcDirs += [signedFirmwareAssets]
        }
    }

    defaultConfig {
        applicationId "com.okrn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * KEPT IN STEP WITH package.json, which is what the app DISPLAYS.
         *
         * These said 1.0 / 1 while the About panel read 0.0.1, because
         * buildInfo takes its `app` string from package.json and nothing tied
         * the two together. Two different numbers for one build is the kind of
         * disagreement that only shows up when someone is trying to work out
         * which apk they are holding.
         *
         * versionCode has to rise for every build handed out: Android refuses
         * to install an apk whose code is lower than the installed one, and
         * treats an equal code as the same build - so a tester who already has
         * one gets "app not installed" rather than an update.
         */
        versionCode 3
        versionName "0.0.3"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // The OnlyKey firmware, compiled for Android - see android/okemu.
    implementation project(':okemu')

    /*
     * BiometricPrompt, and the Keystore integration that makes it mean
     * something. Without androidx.biometric the prompt is API-29-only and its
     * CryptoObject handling differs across versions; with it, one call covers
     * fingerprint, face and the device credential fallback.
     *
     * The point is NOT the prompt. It is that the Keystore key is created with
     * setUserAuthenticationRequired, so a stored secret cannot be decrypted at
     * all without one - including by anything that can read the app's files.
     */
    implementation("androidx.biometric:biometric:1.1.0")

    /*
     * EXPERIMENT (see com.okrn.credprovider + REMOVAL.md). Lets the app register
     * as a system credential provider so Chrome ON THIS PHONE can hand it a
     * WebAuthn call. The provider half of this library is API 34+ only, which is
     * why every class under credprovider is @RequiresApi(34) while minSdk stays
     * at 24 - the library is safe to LINK on an older phone, it is only unsafe
     * to instantiate, and CredProviderGate.enabled() is what guarantees that.
     *
     * Delete this one line to remove the experiment from the build.
     */
    implementation("androidx.credentials:credentials:1.5.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/*
 * Stage the releases before anything merges assets.
 *
 * preBuild is the hook every variant's asset merge already depends on, so one
 * line covers debug and release without naming either.
 */
preBuild.dependsOn stageSignedFirmware
